# generic.conf - protections applied to EVERY Android TV, whatever the vendor.
#
# Format: "protect <package-prefix>". A package is skipped by 02_debloat.sh if
# its name starts with any prefix here. Text after '#' is a comment.

protect android                                  # the Android framework itself
protect com.android.                             # system UI, settings, providers, Wi-Fi...
protect com.google.android.gms                   # Google Play services
protect com.google.android.gsf                   # Google services framework
protect com.google.android.tvlauncher            # Google TV / Android TV home screen
protect com.google.android.leanbacklauncher      # older Android TV home screen
protect com.google.android.tv                    # TV core (input framework, remote service)
protect com.google.android.packageinstaller
protect com.google.android.permissioncontroller
