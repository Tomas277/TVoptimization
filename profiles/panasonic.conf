# panasonic.conf - extra protections for Panasonic TVs.
# Chosen automatically when ro.product.manufacturer is "Panasonic".
#
# STATUS: derived from one real package list: Panasonic 4KTV-JUP (Jupiter_EU,
# MediaTek SoC), Android 11, firmware 3.501. Prefixes are protected on the
# assumption that anything TV-core must survive; they have NOT been
# tested by removing them. Other Panasonic models may use different names.

protect com.mediatek.                # MediaTek TV stack: tuner, inputs, TV center, HAL agents
protect com.mstar.                   # MStar-derived TV services
protect com.panasonic.homescreen     # Panasonic's actual home screen (not the Google one)
protect com.panasonic.controlpanel   # settings / control panel
protect com.panasonic.quickmenu      # quick settings menu
protect panasonic.csmode             # customer service mode UI
protect uk.co.freeview.              # UK Freeview Play (tuner integration, EU/UK models)
